<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Not meant for search engines: the page exists for Meta business verification. -->
  <meta name="robots" content="noindex, nofollow">
  <title>מוטי לאופר</title>
  <style>
    :root {
      --ink: #1d2a33;
      --muted: #5b6770;
      --line: #d9dee2;
      --paper: #fbfcfc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e6ebee;
        --muted: #a3afb7;
        --line: #33404a;
        --paper: #141b20;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 18px/1.65 "Segoe UI", "Arial Hebrew", Arial, sans-serif;
    }
    main {
      max-width: 34rem;
      margin: 0 auto;
      padding: 18vh 1.25rem 4rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 8vw, 3.2rem);
      line-height: 1.1;
      letter-spacing: -0.01em;
    }
    .field {
      margin: 1.25rem 0 0;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
      font-size: 1.25rem;
    }
    footer {
      margin-top: 3rem;
      color: var(--muted);
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>מוטי לאופר</h1>
    <p class="field">פיתוח תוכנה ופתרונות טכנולוגיים</p>
    <footer>© 2026 מוטי לאופר</footer>
  </main>
</body>
</html>
